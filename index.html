
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>College Complaint Portal</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <main class="login-page">

        <section class="login-card">

            <div class="logo">
                CC
            </div>

            <h1>
                College Complaint Portal
            </h1>

            <p class="subtitle">
                A simple and transparent platform
                to submit and track college complaints.
            </p>


            <button
                id="googleLogin"
                class="google-button"
                onclick="loginWithGoogle()">

                <span class="google-icon">
                    G
                </span>

                Continue with Google

            </button>


            <p class="security-note">
                🔒 Secure authentication powered by Firebase
            </p>

        </section>

    </main>


    <script type="module"
            src="js/auth.js">
    </script>

</body>

</html>
